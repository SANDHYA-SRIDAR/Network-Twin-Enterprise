services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8013:8013"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      ASSISTANT_URL: ${ASSISTANT_URL:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
